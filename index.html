<style>
:root{
  --blue:#0a6ed1;--blue2:#0854a0;--shell:#354a5f;--bg:#f5f6f7;--text:#32363a;
  --muted:#6a6d70;--border:#d9d9d9;--green:#107e3e;--red:#bb0000;--orange:#e9730c;
  --shadow:0 1px 4px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;font-family:"72","72full",Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg);font-size:14px}
body{overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(135deg,#354a5f 0%,#243746 48%,#0a6ed1 100%)}
.login-card{width:min(410px,100%);background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden}
.login-head{background:var(--shell);color:#fff;padding:24px}
.login-head h1{font-size:20px;font-weight:600}
.login-head p{margin-top:6px;opacity:.8;font-size:12px}
.login-body{padding:24px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
input,select,textarea{width:100%;min-height:38px;border:1px solid #89919a;border-radius:4px;padding:8px 10px;background:#fff;color:var(--text)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
button{min-height:36px;border:1px solid var(--blue);border-radius:7px;background:#fff;color:var(--blue);padding:0 14px;font-weight:600}
button:hover{background:#eaf3fc}
button.primary{background:var(--blue);color:#fff}
button.primary:hover{background:var(--blue2)}
button.danger{color:var(--red);border-color:var(--red)}
button.icon{border:0;background:transparent;padding:0 8px}
button:disabled{opacity:.55;cursor:wait}
#login-error{color:var(--red);font-size:13px;margin-top:8px}

.shell{min-height:100vh}
.topbar{height:48px;position:sticky;top:0;z-index:20;background:var(--shell);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{width:26px;height:26px;border-radius:5px;background:var(--blue);display:grid;place-items:center;font-weight:700}
.brand-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:2px}
.top-actions button{color:#fff;border-color:transparent;background:transparent}
.top-actions button:hover{background:rgba(255,255,255,.1)}
.tabs{position:sticky;top:48px;z-index:19;height:46px;background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px}
.tabs button{min-height:46px;border:0;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;color:var(--text);background:transparent}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:1280px;margin:auto;padding:18px}
h2{font-size:20px;font-weight:400;margin:3px 0 14px}
h3{font-size:16px;font-weight:600}
.card{background:#fff;border-radius:8px;box-shadow:0 0 0 1px var(--border),var(--shadow);padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.tile{min-height:92px}
.tile small{color:var(--muted);font-size:12px}
.tile strong{display:block;margin-top:7px;font-size:24px;font-weight:400}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{flex:1;min-width:180px}
.table-wrap{background:#fff;border-radius:8px;box-shadow:0 0 0 1px var(--border);overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;background:#f5f6f7;color:var(--muted);font-size:12px;padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #e5e5e5;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr:focus{background:#f5faff;outline:none}
tbody tr:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.status{display:inline-block;padding:2px 8px;border-radius:5px;border:1px solid;font-size:12px;font-weight:600;white-space:nowrap;margin:1px 2px 1px 0}
.status.gray{color:#5b738b;border-color:#5b738b;background:#f5f6f7}
.status.orange{color:var(--orange);border-color:var(--orange);background:#fff8e6}
.status.blue{color:var(--blue);border-color:var(--blue);background:#eaf3fc}
.status.green{color:var(--green);border-color:var(--green);background:#f1fdf6}
.status.red{color:var(--red);border-color:var(--red);background:#ffebeb}
.actions{display:flex;gap:5px;justify-content:flex-end}
.actions button{min-height:30px;padding:0 9px;font-size:12px}

dialog{border:0;border-radius:12px;padding:0;width:min(900px,96vw);max-height:92vh;box-shadow:0 12px 45px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog[open]{display:flex;flex-direction:column}
.dialog-head{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;border-bottom:1px solid var(--border)}
.dialog-body{padding:18px;overflow:auto}
.dialog-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--border);background:#fafafa}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.full{grid-column:1/-1}
.section{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-weight:600}
.item-row,.payment-row{display:grid;gap:7px;align-items:center;margin-bottom:7px}
.item-row{grid-template-columns:3fr 2fr 70px 120px 34px}
.payment-row{grid-template-columns:1fr 130px 150px 34px}
.total-box{text-align:right;padding:12px 0;font-size:15px}
.total-box b{font-size:16px}
#toast{position:fixed;z-index:100;left:50%;bottom:25px;transform:translateX(-50%);background:#32363a;color:#fff;border-radius:7px;padding:11px 18px;box-shadow:0 4px 15px rgba(0,0,0,.25)}

@media(max-width:700px){
  .topbar{padding-left:10px}
  .brand-title{font-size:13px}
  main{padding:10px}
  .tiles{grid-template-columns:repeat(2,1fr);gap:8px}
  .tile{padding:12px;min-height:82px}
  .tile strong{font-size:20px}

  td{border:0;padding:4px 12px;display:flex;justify-content:space-between;gap:15px;text-align:right}
  td::before{content:attr(data-label);color:var(--muted);text-align:left;font-size:12px}
  dialog,dialog[open]{width:100%;max-width:none;height:100dvh;max-height:100dvh;border-radius:0}
  .item-row{grid-template-columns:1fr 1fr 34px}
  .item-row input:nth-child(1),.item-row input:nth-child(2){grid-column:1/-1}
  .payment-row{grid-template-columns:1fr 34px}
  .payment-row input:first-child{grid-column:1/-1}
  .payment-row select{grid-column:1}
  .toolbar{flex-direction:column}
  .toolbar input,.toolbar select,.toolbar button{width:100%}
}

/* ---------- MAIÚSCULAS / VALIDAÇÃO ---------- */
input:not([type=password]):not([type=date]):not([data-mask=email]),textarea,select{text-transform:uppercase}
td{text-transform:uppercase}

/* ---------- RELATÓRIO ---------- */
.rpt{overflow-x:auto}

/* ---------- IMPRESSÃO ---------- */
#print-area{display:none}
@media print{

  .rpt td::before{content:none}

  .rpt tfoot td{background:#eee}
  .rpt h4{font-size:12px}
}

<script>
/* =========================================================
   FIREBASE
========================================================= */
firebase.initializeApp({
  apiKey: "AIzaSyBQ8wnANHOVRE_HIgSWKunpv751BoPr9sc",
  authDomain: "harmoniafuncional-fa6d8.firebaseapp.com",
  databaseURL: "https://harmoniafuncional-fa6d8-default-rtdb.firebaseio.com",
  projectId: "harmoniafuncional-fa6d8",
  storageBucket: "harmoniafuncional-fa6d8.firebasestorage.app",
  messagingSenderId: "454696393035",
  appId: "1:454696393035:web:4cec553f592da2804cb0ce"
});

const auth = firebase.auth();
const db = firebase.firestore();

/* Trabalho offline (falha silenciosa se não suportado ou se outra aba já ativou) */
db.enablePersistence({synchronizeTabs:true}).catch(err=>{
  console.warn("Persistência offline indisponível:",err.code);
});

const LOGIN_EMAIL = "admin@harmoniafuncional.local";

/* =========================================================
   UTILITÁRIOS
========================================================= */
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];

const esc = value =>
  String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));

const today = () =>
  new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

const dateBR = value => value ? value.split("-").reverse().join("/") : "-";

const money = c =>
  (Number(c||0)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

/* Aceita "1.500", "1.500,00", "1500,5", "1500.50" */
const cents = value => {
  let v = String(value ?? "").trim();
  if(!v) return 0;

  if(v.includes(",")){
    v = v.replace(/\./g,"").replace(",",".");
  }else if(/^\d{1,3}(\.\d{3})+$/.test(v)){
    v = v.replace(/\./g,""); // ponto como separador de milhar
  }
  return Math.round(parseFloat(v)*100) || 0;
};

const moneyInput = value => (Number(value||0)/100).toFixed(2).replace(".",",");

/* =========================================================
   MÁSCARAS, MAIÚSCULAS E VALIDAÇÕES
========================================================= */
const digits = v => String(v ?? "").replace(/\D/g,"");

function maskPhone(v){
  const d = digits(v).slice(0,11);
  if(!d) return "";
  if(d.length<=2) return "("+d;
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}

function maskCPF(v){
  const d = digits(v).slice(0,11);
  let out = d.slice(0,3);
  if(d.length>3) out += "."+d.slice(3,6);
  if(d.length>6) out += "."+d.slice(6,9);
  if(d.length>9) out += "-"+d.slice(9,11);
  return out;
}

function validCPF(v){
  const d = digits(v);
  if(d.length!==11 || /^(\d)\1{10}$/.test(d)) return false;
  for(let t=9;t<11;t++){
    let s = 0;
    for(let i=0;i<t;i++) s += Number(d[i])*(t+1-i);
    if((s*10)%11%10 !== Number(d[t])) return false;
  }
  return true;
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

const MASK_RULES = {
  email:{test:v=>EMAIL_RE.test(v), msg:"E-MAIL INVÁLIDO. USE O FORMATO NOME@DOMINIO.COM."},
  cpf:{test:validCPF, msg:"CPF INVÁLIDO."},
  phone:{test:v=>[10,11].includes(digits(v).length), msg:"TELEFONE INVÁLIDO. INFORME DDD + NÚMERO."}
};

const MASK_ATTRS = {
  phone:'data-mask="phone" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000"',
  cpf:'data-mask="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"',
  email:'data-mask="email" inputmode="email" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="nome@dominio.com"'
};

const MASK_FNS = {phone:maskPhone, cpf:maskCPF};

/* Aplica a máscara mantendo o cursor na mesma posição (contada em dígitos) */
function setMasked(el,fn){
  const pos = el.selectionStart ?? el.value.length;
  const before = digits(el.value.slice(0,pos)).length;
  el.value = fn(el.value);
  let p = 0;
  if(before>0){
    let c = 0;
    for(p=0;p<el.value.length;p++){
      if(/\d/.test(el.value[p])) c++;
      if(c===before){ p++; break; }
    }
  }
  try{ el.setSelectionRange(p,p); }catch{}
}

/* Tudo que o usuário digita vira MAIÚSCULA (exceto senha, datas, números e e-mail) */
function normalizeInput(el){

  if(!el.matches?.("input,textarea") || el.readOnly) return;
  if(["password","date","number","checkbox","radio","button"].includes(el.type)) return;

  el.classList.remove("invalid");

  const mask = el.dataset.mask;

  if(MASK_FNS[mask]) return setMasked(el,MASK_FNS[mask]);

  if(mask==="email"){
    const pos = el.selectionStart ?? el.value.length;
    const clean = el.value.replace(/\s/g,"").toLowerCase();
    if(clean!==el.value){
      const keep = el.value.slice(0,pos).replace(/\s/g,"").length;
      el.value = clean;
      try{ el.setSelectionRange(keep,keep); }catch{}
    }
    return;
  }

  const start = el.selectionStart, end = el.selectionEnd;
  const upper = el.value.toUpperCase();
  if(upper!==el.value){
    el.value = upper;
    try{ el.setSelectionRange(start,end); }catch{}
  }
}

function validateField(el){
  const rule = MASK_RULES[el.dataset.mask];
  const v = el.value.trim();
  const ok = !rule || !v || rule.test(v);
  el.classList.toggle("invalid",!ok);
  return ok;
}

function validateDialogMasks(){
  for(const el of $$("[data-mask]",dialog)){
    if(!validateField(el)){
      toast(MASK_RULES[el.dataset.mask].msg);
      el.focus();
      return false;
    }
  }
  return true;
}

function addDays(iso,n){
  if(!iso) return "";
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y,m-1,d+n);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}

const timestamp = () => firebase.firestore.FieldValue.serverTimestamp();

function toast(message){
  const el = $("#toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.hidden = true; },3500);
}

function status(text,type){
  return `<span class="status ${type}">${esc(text)}</span>`;
}

const STATUS_OS = ["RECEBIDO","EM PROVA","EM ACABAMENTO","CONCLUÍDO","ENTREGUE"];
const STATUS_ORC = ["ABERTO","APROVADO","RECUSADO"];
const PAYMENT_TYPES = ["PIX","DINHEIRO","CARTÃO","TRANSFERÊNCIA","BOLETO"];

function osStatus(value){
  const map = {
    "RECEBIDO":"gray","EM PROVA":"orange","EM ACABAMENTO":"blue",
    "CONCLUÍDO":"green","ENTREGUE":"green"
  };
  return status(value,map[value]||"gray");
}

/* Usa o mesmo cálculo de normalizeOrder e mostra o atraso mesmo em pagamento parcial */
function paymentStatus(o){
  if(o.statusPagamento==="PAGO") return status("PAGO","green");
  let html = o.statusPagamento==="PARCIAL"
    ? status("PARCIAL","orange")
    : status("PENDENTE","gray");
  if(o.atrasado) html += status("VENCIDO","red");
  return html;
}

/* =========================================================
   ESTADO
========================================================= */
const initialState = () => ({
  tab:"dashboard",
  dentists:[],
  orders:[],
  quotes:[],
  lab:{},
  search:"",
  filter:""
});

const state = initialState();

let unsubscribers = [];
const dialog = $("#dialog");

/* =========================================================
   NORMALIZAÇÃO
========================================================= */
function normalizeOrder(o){

  if(!Array.isArray(o.itens)){
    const value = Math.round(Number(o.valor||0)*100);
    o.itens = [{descricao:o.tipo||"",cor:o.cor||"",quantidade:1,valor:value}];
    o.pagamentos = o.pagamento==="PAGO"
      ? [{data:o.previsao||today(),valor:value,forma:"PIX"}]
      : [];
  }

  o.pagamentos = Array.isArray(o.pagamentos)
    ? o.pagamentos
    : Array.isArray(o.pags) ? o.pags : [];

  o.total = o.itens.reduce(
    (sum,i)=>sum+(Number(i.quantidade||i.q||1)*Number(i.valor??i.v??0)),0
  );

  o.pago = o.pagamentos.reduce((sum,p)=>sum+Number(p.valor??p.v??0),0);
  o.saldo = Math.max(o.total-o.pago,0);

  o.statusPagamento =
    o.total>0 && o.saldo===0 ? "PAGO"
    : o.pago>0 ? "PARCIAL"
    : "PENDENTE";

  o.atrasado = o.saldo>0 && !!o.vencimento && o.vencimento<today();

  return o;
}

function dentistName(o){
  const d = state.dentists.find(x=>x.id===o.dentistaId);
  return d?.nome || o.dentistaNome || "-";
}

const createdTime = o => o.criadoEm?.toMillis?.() || 0;

/* =========================================================
   RENDER AGRUPADO (evita re-render em cascata)
========================================================= */
let renderQueued = false;

function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{
    renderQueued = false;
    render();
  });
}

/* =========================================================
   LOGIN
========================================================= */
let authReady = false;

function applyAuth(user){

  $("#login").hidden = !!user;
  $("#app").hidden = !user;

  if(user){
    startData();
  }else{
    stopData();
    $("#password").value = "";
    setTimeout(()=>{
      const pw = $("#password");
      if(pw){ pw.focus(); pw.select(); }
    },50);
  }
}

auth.onAuthStateChanged(user=>{
  if(authReady) applyAuth(user);
});

/* Sessão NÃO é guardada: ao abrir ou recarregar a página, a senha é sempre pedida.
   O signOut inicial também descarta sessões antigas salvas antes desta alteração. */
(async()=>{
  try{ await auth.setPersistence(firebase.auth.Auth.Persistence.NONE); }
  catch(err){ console.warn("setPersistence:",err); }

  try{ await auth.signOut(); }
  catch(err){ console.warn("signOut inicial:",err); }

  authReady = true;
  applyAuth(auth.currentUser);
})();

async function doLogin(){

  if(!authReady){ toast("AGUARDE UM INSTANTE..."); return; }

  const button = $("#login-button");
  const error = $("#login-error");
  const password = $("#password").value;

  error.hidden = true;
  button.disabled = true;

  try{
    await auth.signInWithEmailAndPassword(LOGIN_EMAIL,password);
  }catch(err){

    console.error("ERRO DE LOGIN FIREBASE:",err);

    const messages = {
      "auth/invalid-api-key":"A CHAVE DA API DO FIREBASE ESTÁ INVÁLIDA.",
      "auth/api-key-not-valid":"A CHAVE DA API DO FIREBASE ESTÁ INVÁLIDA.",
      "auth/wrong-password":"SENHA INCORRETA.",
      "auth/invalid-credential":"SENHA INCORRETA.",
      "auth/user-not-found":"USUÁRIO NÃO ENCONTRADO NO FIREBASE AUTHENTICATION.",
      "auth/unauthorized-domain":"DOMÍNIO NÃO AUTORIZADO NO FIREBASE (AUTHENTICATION > SETTINGS).",
      "auth/too-many-requests":"MUITAS TENTATIVAS. AGUARDE UM POUCO.",
      "auth/operation-not-allowed":"LOGIN POR E-MAIL/SENHA NÃO ESTÁ ATIVADO NO FIREBASE.",
      "auth/network-request-failed":"SEM CONEXÃO COM A INTERNET."
    };

    error.textContent = messages[err.code] || ("ERRO DE LOGIN: "+(err.code||err.message));
    error.hidden = false;

  }finally{
    button.disabled = false;
  }
}

$("#login-button").addEventListener("click",doLogin);

$("#password").addEventListener("keydown",e=>{
  if(e.key==="Enter"){ e.preventDefault(); doLogin(); }
});

/* =========================================================
   DADOS
========================================================= */
function stopData(){
  unsubscribers.forEach(fn=>fn());
  unsubscribers = [];
  Object.assign(state,initialState()); // limpa dados em memória ao sair
  $("#content").innerHTML = "";
}

/* "estimate" evita criadoEm = null enquanto o servidor não confirma */
const docData = d => ({id:d.id,...d.data({serverTimestamps:"estimate"})});

function startData(){

  stopData();

  unsubscribers.push(
    db.collection("dentistas").onSnapshot(snapshot=>{
      state.dentists = snapshot.docs.map(docData);
      state.dentists.sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR"));
      scheduleRender();
    },handleFirebaseError)
  );

  unsubscribers.push(
    db.collection("ordens_servico").onSnapshot(snapshot=>{
      state.orders = snapshot.docs.map(docData);
      state.orders.forEach(normalizeOrder);
      state.orders.sort((a,b)=>createdTime(b)-createdTime(a));
      scheduleRender();
    },handleFirebaseError)
  );

  unsubscribers.push(
    db.collection("orcamentos").onSnapshot(snapshot=>{
      state.quotes = snapshot.docs.map(docData);
      state.quotes.forEach(normalizeOrder);
      state.quotes.sort((a,b)=>createdTime(b)-createdTime(a));
      scheduleRender();
    },handleFirebaseError)
  );

  unsubscribers.push(
    db.doc("config/lab").onSnapshot(snapshot=>{
      state.lab = snapshot.data()||{};
    },handleFirebaseError)
  );
}

function handleFirebaseError(err){
  console.error(err);
  toast("ERRO FIREBASE: "+err.message);
}

/* =========================================================
   NUMERAÇÃO
========================================================= */
async function nextNumber(type){

  const year = new Date().getFullYear();
  const ref = db.doc("contadores/"+type+year);

  const n = await db.runTransaction(async transaction=>{
    const snapshot = await transaction.get(ref);
    const current = snapshot.exists ? Number(snapshot.data().n||0) : 0;
    const next = current+1;
    transaction.set(ref,{n:next});
    return next;
  });

  return String(n).padStart(3,"0")+"/"+year;
}

function tile(label,value){
  return `
    <div class="card tile">
      <small>${label}</small>
      <strong>${value}</strong>
    </div>`;
}

function sumOrders(fn){
  return state.orders.reduce((s,o)=>s+fn(o),0);
}

function renderDashboard(){

  const active = state.orders.filter(o=>o.status!=="ENTREGUE");
  const late = active.filter(o=>o.previsao && o.previsao<today());

  const next = active.slice()
    .sort((a,b)=>(a.previsao||"9999")>(b.previsao||"9999")?1:-1)
    .slice(0,8);

  const billed = sumOrders(o=>o.total);
  const received = sumOrders(o=>o.pago);
  const receivable = sumOrders(o=>o.saldo);
  const overdue = state.orders.filter(o=>o.atrasado).reduce((s,o)=>s+o.saldo,0);

  return `
    <h2>PAINEL GERAL</h2>

    <div class="tiles">
      ${tile("OS EM ANDAMENTO",active.length)}
      ${tile("ENTREGAS ATRASADAS",late.length)}
      ${tile("FATURADO",money(billed))}
      ${tile("RECEBIDO",money(received))}
      ${tile("A RECEBER",money(receivable))}
      ${tile("VENCIDO",money(overdue))}
      ${tile("DENTISTAS",state.dentists.length)}

  `;
}

function field(name,label,value="",type="text",extra=""){

}

function selectField(name,label,options,value){
  return `
    <label class="field">
      <span>${label}</span>
      <select data-field="${name}">
        ${options.map(o=>{
          const val = typeof o==="string" ? o : o.value;
          const text = typeof o==="string" ? o : o.text;
          return `<option value="${esc(val)}" ${String(val)===String(value)?"selected":""}>${esc(text)}</option>`;
        }).join("")}
      </select>
    </label>`;
}

function getField(name){
  const el = $(`[data-field="${name}"]`,dialog);
  if(!el) return "";
  const v = el.value.trim();
  if(el.dataset.mask==="email") return v.toLowerCase();
  if(el.tagName==="SELECT" || ["date","number","password"].includes(el.type)) return v;
  return v.toUpperCase();
}

function paymentRow(payment={}){

function readItems(){
  return $$(".item-row",dialog).map(row=>({
    descricao:$('[data-item="descricao"]',row).value.trim().toUpperCase(),
    cor:$('[data-item="cor"]',row).value.trim().toUpperCase(),
    quantidade:parseInt($('[data-item="quantidade"]',row).value)||1,
    valor:cents($('[data-item="valor"]',row).value)
  })).filter(i=>i.descricao||i.valor);
}

function readPayments(){
  return $$(".payment-row",dialog).map(row=>({
    data:$('[data-payment="data"]',row).value||today(),
    valor:cents($('[data-payment="valor"]',row).value),
    forma:$('[data-payment="forma"]',row).value
  })).filter(p=>p.valor);
}

function calculateDialog(){

  const total = readItems().reduce((s,i)=>s+i.quantidade*i.valor,0);
  const paid = readPayments().reduce((s,p)=>s+p.valor,0);
  const balance = Math.max(total-paid,0);

  const box = $("#dialog-total");

  if(box){
    box.innerHTML = `
      TOTAL: <b>${money(total)}</b>
      &nbsp;&nbsp;
      PAGO: <b>${money(paid)}</b>
      &nbsp;&nbsp;
      SALDO: <b>${money(balance)}</b>`;
  }
}

    : `

    </div>

    <div id="items">${o.itens.map(itemRow).join("")}</div>

    ${isOrder ? `
      <div class="section">
        <span>PAGAMENTOS RECEBIDOS</span>
        <button class="icon" data-action="add-payment" type="button">+ PAGAMENTO</button>
      </div>
      <div id="payments">${o.pagamentos.map(paymentRow).join("")}</div>
    ` : ""}

    <div id="dialog-total" class="total-box"></div>

    <label class="field full">
      <span>OBSERVAÇÕES</span>
      <textarea data-field="observacoes" rows="3">${esc(o.observacoes||o.obs||"")}</textarea>
    </label>`;

  let footer = `
    <button class="primary" data-action="save-document">SALVAR</button>
    <button data-action="close-dialog">CANCELAR</button>`;

  if(id){
    footer += `
      <button data-action="print" data-type="${type}" data-id="${id}">🖨 IMPRIMIR / PDF</button>`;

      footer += `<button data-action="generate-order" data-id="${id}">GERAR OS</button>`;

    footer += `
      <button class="danger" data-action="delete" data-type="${type}" data-id="${id}">EXCLUIR</button>`;

  openDialog((isOrder?"OS ":"ORÇAMENTO ")+(id?o.numero:"NOVO"),body,footer);
}

/* =========================================================
   SALVAMENTO
========================================================= */
async function saveDocument(){

  const type = dialog.dataset.type;
  const id = dialog.dataset.id;
  const isOrder = type==="order";

  const dentistId = getField("dentistaId");
  const patient = getField("paciente");
  const items = readItems();

  if(!dentistId || !patient || !items.length){
    toast("INFORME DENTISTA, PACIENTE E AO MENOS UM ITEM.");
    return;
  }

  if(!validateDialogMasks()) return;

  const dentist = state.dentists.find(d=>d.id===dentistId);

  const data = {
    dentistaId:dentistId,
    dentistaNome:dentist?.nome||"",
    paciente:patient,
    cpfPaciente:getField("cpfPaciente"),
    status:getField("status"),
    itens:items,
    observacoes:getField("observacoes")
  };

  if(isOrder){
    data.previsao = getField("previsao");
    data.vencimento = getField("vencimento");
    data.pagamentos = readPayments();
  }else{
    data.validade = parseInt(getField("validade"))||30;
  }

  const ref = db.collection(isOrder ? "ordens_servico" : "orcamentos");

  if(id){
    await ref.doc(id).update(data);
  }else{
    data.numero = await nextNumber(isOrder ? "os" : "orc");
    data.data = today();
    data.criadoEm = timestamp();
    await ref.add(data);
  }

  dialog.close();
  toast("SALVO COM SUCESSO");
}

async function saveDentist(){

  const name = getField("nome");

  if(!name){
    toast("INFORME O NOME DO DENTISTA.");
    return;
  }

  if(!validateDialogMasks()) return;

  const data = {
    nome:name,
    cro:getField("cro"),
    cpf:getField("cpf"),
    telefone:getField("telefone"),
    email:getField("email"),
    endereco:getField("endereco")
  };

  const id = dialog.dataset.id;

  if(id){
    await db.collection("dentistas").doc(id).update(data);
  }else{
    data.criadoEm = timestamp();
    await db.collection("dentistas").add(data);
  }

  dialog.close();
  toast("DENTISTA SALVO");
}

async function saveConfig(){

  if(!validateDialogMasks()) return;

/* arrayUnion evita sobrescrever pagamentos feitos em outra aba/dispositivo */
async function savePayment(){

  const id = dialog.dataset.id;
  const order = state.orders.find(o=>o.id===id);
  if(!order) return;

  const value = cents(getField("valor"));

  if(!value){
    toast("INFORME O VALOR.");
    return;
  }

  if(value>order.saldo){
    toast("O VALOR NÃO PODE SER MAIOR QUE O SALDO.");
    return;
  }

  const payment = {
    data:getField("data")||today(),
    valor:value,
    forma:getField("forma")
  };

  await db.collection("ordens_servico").doc(id).update({
    pagamentos:firebase.firestore.FieldValue.arrayUnion(payment)
  });

  dialog.close();
  toast("PAGAMENTO REGISTRADO");
}

/* =========================================================
   EXCLUSÃO
========================================================= */
async function deleteRecord(type,id){

  if(!id) return;

  /* valida ANTES de pedir confirmação */
  if(type==="dentist"){
    const hasDocs =
      state.orders.some(o=>o.dentistaId===id) ||
      state.quotes.some(q=>q.dentistaId===id);

    if(hasDocs){
      toast("ESTE DENTISTA POSSUI OS OU ORÇAMENTOS. EXCLUA-OS ANTES.");
      return;
    }
  }

  if(!confirm("EXCLUIR ESTE REGISTRO?\n\nA ação não pode ser desfeita.")) return;

  const collection = {
    order:"ordens_servico",
    quote:"orcamentos",
    dentist:"dentistas"
  }[type];

  await db.collection(collection).doc(id).delete();

  if(dialog.open) dialog.close();

  toast("REGISTRO EXCLUÍDO");
}

/* =========================================================
   GERAR OS A PARTIR DO ORÇAMENTO (atômico)
========================================================= */
async function generateOrder(id){

  const quote = state.quotes.find(q=>q.id===id);
  if(!quote) return;

  if(quote.osNum){
    toast("ESTE ORÇAMENTO JÁ GEROU A OS "+quote.osNum+".");
    return;
  }

  if(!confirm("GERAR UMA OS A PARTIR DESTE ORÇAMENTO?")) return;

  try{

    const number = await nextNumber("os");
    const batch = db.batch();

    batch.set(db.collection("ordens_servico").doc(),{
      numero:number,
      dentistaId:quote.dentistaId,
      dentistaNome:quote.dentistaNome||"",
      paciente:quote.paciente,
      cpfPaciente:quote.cpfPaciente||"",
      data:today(),
      status:"RECEBIDO",
      previsao:"",
      vencimento:"",
      itens:quote.itens||[],
      pagamentos:[],
      observacoes:quote.observacoes||quote.obs||"",
      orcNum:quote.numero,
      criadoEm:timestamp()
    });

    batch.update(db.collection("orcamentos").doc(id),{
      status:"APROVADO",
      osNum:number
    });

    await batch.commit();

    dialog.close();
    toast("OS "+number+" CRIADA COM SUCESSO");

  }catch(err){
    console.error(err);
    toast("ERRO AO GERAR OS: "+err.message);
  }
}

/* =========================================================
   RELATÓRIO FINANCEIRO
========================================================= */
function docDate(o){
  if(o.data) return o.data;
  const ms = createdTime(o);
  return ms ? new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,10) : "";
}

const payLabel = o => (o.atrasado && o.statusPagamento!=="PAGO")
  ? o.statusPagamento+" / VENCIDO"
  : o.statusPagamento;

function readReportFilters(){
  return {
    de:getField("de"),
    ate:getField("ate"),
    dentista:getField("dentistaId"),
    situacao:getField("situacao")
  };
}

function reportRows(f){
  return state.orders.filter(o=>{
    const d = docDate(o);
    if(f.de && (!d || d<f.de)) return false;
    if(f.ate && (!d || d>f.ate)) return false;
    if(f.dentista && o.dentistaId!==f.dentista) return false;
    if(f.situacao==="VENCIDO") return o.atrasado;
    if(f.situacao && o.statusPagamento!==f.situacao) return false;
    return true;
  }).sort((a,b)=>
    docDate(a).localeCompare(docDate(b)) || String(a.numero).localeCompare(String(b.numero))
  );
}

function reportBody(rows){

  if(!rows.length)
    return `<div class="card empty">NENHUM REGISTRO PARA OS FILTROS INFORMADOS.</div>`;

  const sum = k => rows.reduce((s,o)=>s+o[k],0);

  const groups = {};
  rows.forEach(o=>{
    const g = groups[dentistName(o)] ||= {n:0,total:0,pago:0,saldo:0};
    g.n++; g.total+=o.total; g.pago+=o.pago; g.saldo+=o.saldo;
  });

  const summary = Object.entries(groups)
    .sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"));

  return `
  <div class="rpt">
    <table>
      <thead>
        <tr>
          <th>OS</th><th>DATA</th><th>PACIENTE</th><th>DENTISTA</th><th>VENC.</th>
          <th class="num">TOTAL</th><th class="num">PAGO</th><th class="num">SALDO</th><th>SITUAÇÃO</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(o=>`
          <tr>
            <td><b>${esc(o.numero)}</b></td>
            <td>${dateBR(docDate(o))}</td>
            <td>${esc(o.paciente)}</td>
            <td>${esc(dentistName(o))}</td>
            <td>${dateBR(o.vencimento)}</td>
            <td class="num">${money(o.total)}</td>
            <td class="num">${money(o.pago)}</td>
            <td class="num">${money(o.saldo)}</td>
            <td>${esc(payLabel(o))}</td>
          </tr>`).join("")}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="5">TOTAL (${rows.length} OS)</td>
          <td class="num">${money(sum("total"))}</td>
          <td class="num">${money(sum("pago"))}</td>
          <td class="num">${money(sum("saldo"))}</td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <h4>RESUMO POR DENTISTA</h4>
    <table>
      <thead>
        <tr>
          <th>DENTISTA</th><th class="num">OS</th>
          <th class="num">TOTAL</th><th class="num">PAGO</th><th class="num">SALDO</th>
        </tr>
      </thead>
      <tbody>
        ${summary.map(([name,g])=>`
          <tr>
            <td>${esc(name)}</td>
            <td class="num">${g.n}</td>
            <td class="num">${money(g.total)}</td>
            <td class="num">${money(g.pago)}</td>
            <td class="num">${money(g.saldo)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function openReport(){

  dialog.dataset.type = "report";
  dialog.dataset.id = "";

  const first = today().slice(0,8)+"01";

  const body = `
    <div class="grid">
      ${field("de","DE (DATA DA OS)",first,"date")}

        [{value:"",text:"TODAS"},"PENDENTE","PARCIAL","PAGO","VENCIDO"],"")}

function runReport(){
  const box = $("#report-preview");
  if(box) box.innerHTML = reportBody(reportRows(readReportFilters()));
}

function printReport(){

  const f = readReportFilters();

  if(f.de && f.ate && f.de>f.ate){
    toast("A DATA INICIAL NÃO PODE SER MAIOR QUE A FINAL.");
    return;
  }

  const rows = reportRows(f);

  if(!rows.length){
    toast("NENHUM REGISTRO PARA IMPRIMIR.");
    return;
  }

  const lab = state.lab||{};
  const dentist = f.dentista
    ? (state.dentists.find(d=>d.id===f.dentista)?.nome||"-")
    : "TODOS";

  $("#print-area").innerHTML = `
    <div class="print-page">

      <div class="print-header">
        <h1>${esc(lab.nome||"LABORATÓRIO HARMONIA FUNCIONAL")}</h1>
        <p>
          ${[lab.cnpj?"CNPJ: "+lab.cnpj:"",lab.tel||"",lab.end||""]
            .filter(Boolean).map(esc).join(" | ")}
        </p>
      </div>

      <div class="print-title">RELATÓRIO FINANCEIRO</div>

      <table class="print-info">
        <tr><td>PERÍODO</td><td>${f.de?dateBR(f.de):"INÍCIO"} A ${f.ate?dateBR(f.ate):"HOJE"}</td></tr>
        <tr><td>DENTISTA</td><td>${esc(dentist)}</td></tr>
        <tr><td>SITUAÇÃO</td><td>${esc(f.situacao||"TODAS")}</td></tr>
        <tr><td>EMITIDO EM</td><td>${dateBR(today())}</td></tr>
      </table>

      ${reportBody(rows)}
    </div>`;

  setTimeout(()=>window.print(),100);
}

/* =========================================================
   EVENTOS
========================================================= */
document.addEventListener("click",async event=>{

  const el = event.target.closest("[data-action]");
  if(!el) return;

  const action = el.dataset.action;

  /* Botões dentro de uma linha clicável: executam só a própria ação */
  if(el.tagName==="BUTTON") event.stopPropagation();

  const guarded = async fn=>{
    el.disabled = true;
    try{ await fn(); }finally{ el.disabled = false; }
  };

  try{

    switch(action){

      case "logout": await auth.signOut(); break;

      case "config": openConfig(); break;

      case "tab":
        state.tab = el.dataset.tab;
        state.search = "";
        state.filter = "";
        render();
        break;

      case "new-order": openDocument("order"); break;
      case "new-quote": openDocument("quote"); break;
      case "new-dentist": openDentist(); break;

      case "edit": openDocument(el.dataset.type,el.dataset.id); break;
      case "edit-dentist": openDentist(el.dataset.id); break;

      case "close-dialog": dialog.close(); break;

      case "add-item":
        $("#items").insertAdjacentHTML("beforeend",itemRow({quantidade:1}));
        $$("#items .item-row:last-child input")[0]?.focus();
        break;

      case "add-payment":
        $("#payments").insertAdjacentHTML("beforeend",paymentRow({data:today(),forma:"PIX"}));
        calculateDialog();
        break;

      case "remove-row":
        el.closest(".item-row,.payment-row")?.remove();
        calculateDialog();
        break;

      case "save-document": await guarded(saveDocument); break;
      case "save-dentist": await guarded(saveDentist); break;
      case "save-config": await guarded(saveConfig); break;
      case "save-payment": await guarded(savePayment); break;

      case "receive": openReceive(el.dataset.id); break;

      case "delete":
        await deleteRecord(el.dataset.type,el.dataset.id);
        break;

      case "delete-dentist":
        await deleteRecord("dentist",el.dataset.id);
        break;

      case "generate-order": await generateOrder(el.dataset.id); break;

      case "print": printDocument(el.dataset.type,el.dataset.id); break;

      case "report": openReport(); break;
      case "print-report": printReport(); break;
    }

  }catch(err){
    console.error(err);
    toast("ERRO: "+err.message);
  }
});

/* Linhas da tabela acessíveis por teclado (Enter / Espaço) */
document.addEventListener("keydown",event=>{

  if(event.key!=="Enter" && event.key!==" ") return;

  const row = event.target.closest?.("tr[data-action]");

  if(row && event.target===row){
    event.preventDefault();
    row.click();
  }
});

/* =========================================================
   INPUT / FILTROS
========================================================= */
document.addEventListener("input",event=>{

  const el = event.target;

  if(!event.isComposing) normalizeInput(el);

  if(el.id==="search"){
    state.search = el.value;
    renderKeepingSearch();
  }

  if(el.matches('[data-item="valor"],[data-payment="valor"],[data-item="quantidade"]')){
    calculateDialog();
  }
});

document.addEventListener("change",event=>{

  const el = event.target;

  if(el.id==="filter"){
    state.filter = el.value;
    render();
  }

  if(dialog.open && dialog.dataset.type==="report" && el.closest("dialog")) runReport();

  if(el.matches('[data-item="valor"],[data-payment="valor"],[data-item="quantidade"]')){
    calculateDialog();
  }
});

document.addEventListener("compositionend",event=>normalizeInput(event.target));

/* =========================================================
   ENTER AVANÇA PARA O PRÓXIMO CAMPO DENTRO DOS MODAIS
========================================================= */
document.addEventListener("keydown",event=>{

  if(event.key!=="Enter" || event.isComposing) return;

  const target = event.target;

  if(target.tagName==="TEXTAREA" && !event.ctrlKey) return;
  if(target.tagName==="BUTTON") return;

  const dlg = target.closest("dialog");
  if(!dlg) return;

  event.preventDefault();

  const fields = [...dlg.querySelectorAll("input:not([readonly]),select,textarea,button")]
    .filter(x=>!x.disabled && x.offsetParent!==null && x.tabIndex>=0);

  const next = fields[fields.indexOf(target)+1];
  if(next) next.focus();
});

/* =========================================================
   FORMATAÇÃO MONETÁRIA AO SAIR DO CAMPO
========================================================= */
document.addEventListener("focusout",event=>{

  const el = event.target;

  if(el.dataset?.mask) validateField(el);

  if(el.matches('[data-item="valor"],[data-payment="valor"]') && el.value){
    el.value = moneyInput(cents(el.value));
  }
});
